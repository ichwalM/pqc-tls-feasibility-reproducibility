# Hybrid post-quantum TLS 1.3 suite -- X25519MLKEM768 (ML-KEM / FIPS 203)
# PENTING: nama grup persis tergantung versi oqs-provider/OpenSSL yang terpasang.
# Verifikasi nama grup yang benar-benar tersedia dengan:
#   openssl list -kem-algorithms
# SEBELUM mengasumsikan "X25519MLKEM768" persis dikenali. Kalau toolchain masih
# memakai nama lama (mis. "x25519_kyber768" / "X25519Kyber768Draft00"), catat
# ekuivalensinya satu kalimat di paper -- jangan diam-diam pakai grup lama sambil
# melaporkan hasil seolah itu ML-KEM standar FIPS 203.

worker_processes 1;
worker_cpu_affinity 0001;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
}

http {
    access_log off;

    # WAJIB, sama seperti nginx-classical.conf: paksa full handshake per
    # request, bukan reuse koneksi keep-alive. Harus identik di kedua suite
    # supaya bukan jadi confound tambahan.
    keepalive_timeout 0;

    server {
        # Ganti ke 8443 kalau instance ini jalan BERSAMAAN dengan instance
        # classical di mesin yang sama (lihat docs/RUNBOOK.md Fase 8).
        listen 443 ssl;
        server_name _;

        ssl_protocols TLSv1.3;
        ssl_conf_command Groups X25519MLKEM768;

        ssl_session_cache off;
        ssl_session_tickets off;
        ssl_early_data off;

        ssl_certificate     /etc/nginx/pki/server.crt;
        ssl_certificate_key /etc/nginx/pki/server.key;

        location / {
            return 200 "hybrid-ok\n";
            add_header Content-Type text/plain;
        }
    }
}
