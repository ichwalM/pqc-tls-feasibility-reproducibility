# Classical TLS 1.3 suite -- X25519 only
# Gunakan dengan binary nginx yang di-link ke OpenSSL 3.5+ (Jalur A) atau image
# openquantumsafe/nginx (Jalur B) supaya konfigurasi ssl_conf_command dikenali.

worker_processes 1;
worker_cpu_affinity 0001;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
}

http {
    # I/O disk sengaja dimatikan supaya tidak mencemari pengukuran CPU/latency,
    # terutama di tier dengan HDD (low/mid).
    access_log off;

    # WAJIB: tanpa ini, wrk akan reuse koneksi TLS yang sama sepanjang durasi
    # test (perilaku default keep-alive) -- artinya cuma beberapa handshake
    # terjadi di awal, bukan berulang seperti yang dimaksud RQ2/RQ3. Dengan
    # keepalive_timeout 0, server menutup koneksi tiap response selesai,
    # memaksa client membuka handshake TLS baru per request.
    keepalive_timeout 0;

    server {
        listen 443 ssl;
        server_name _;

        ssl_protocols TLSv1.3;
        ssl_conf_command Groups X25519;

        # Wajib: matikan resumption/0-RTT supaya tiap koneksi = full handshake.
        ssl_session_cache off;
        ssl_session_tickets off;
        ssl_early_data off;

        ssl_certificate     /etc/nginx/pki/server.crt;
        ssl_certificate_key /etc/nginx/pki/server.key;

        location / {
            return 200 "classical-ok\n";
            add_header Content-Type text/plain;
        }
    }
}
