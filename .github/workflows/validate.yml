name: Validate research artifacts

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate dataset structure
        run: python scripts/analysis/verify_dataset.py

      - name: Recompute paper statistics
        run: python scripts/analysis/paper_statistics.py

